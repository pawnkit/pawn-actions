name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pawnlint-asset: pawnlint_1.1.11_linux_amd64.tar.gz
            pawnlint-sha256: bc011fea1c27ef0c1f648c8a821c62e99cc8a1f747ff8ff6c1bf074a35b0ea84
          - os: windows-latest
            pawnlint-asset: pawnlint_1.1.11_windows_amd64.zip
            pawnlint-sha256: 7b8f17f8519dd2a4338fbc70174c1a376fdf4459d66db7798c773de3ca2d3165
          - os: macos-latest
            pawnlint-asset: pawnlint_1.1.11_darwin_arm64.tar.gz
            pawnlint-sha256: dc6cb8d83fc057b279627d064994a1186e66203f98274ebd1c571a16f5371590
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./setup-tool
        with:
          binary: pawnlint
          version: v1.1.11
          download-url: https://github.com/pawnkit/pawnlint/releases/download/v1.1.11/${{ matrix.pawnlint-asset }}
          sha256: ${{ matrix.pawnlint-sha256 }}
      - run: pawnlint --version
      - run: go test ./...
      - run: go vet ./...
      - if: ${{ runner.os == 'Linux' }}
        run: CGO_ENABLED=1 go test -race -shuffle=on ./...
      - if: ${{ runner.os == 'Linux' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: pawnkit/pawnkit-spec
          ref: v0.1.34
          path: .test/pawnkit-spec
          persist-credentials: false
      - if: ${{ runner.os == 'Linux' }}
        run: go run ./cmd/pawn-release-set -go-mod go.mod .test/pawnkit-spec/examples/pawn-release-set/valid.json
      - if: ${{ runner.os == 'Linux' }}
        run: go run ./cmd/pawn-release-set .test/pawnkit-spec/examples/pawn-release-set-v2/valid.json
      - if: ${{ runner.os == 'Linux' }}
        run: go run ./cmd/pawn-support-check -repository pawnkit/pawnlint -targets linux-amd64,windows-amd64,darwin-arm64 .test/pawnkit-spec/examples/pawn-support/valid.json
      - if: ${{ runner.os == 'Linux' }}
        uses: ./release-set
        with:
          release-set: .test/pawnkit-spec/examples/pawn-release-set/valid.json
          verify-remote: 'false'
      - shell: bash
        run: bash tests/test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.11.4
      - run: go tool actionlint
      - run: shellcheck setup/*.sh check/*.sh build/*.sh tests/*.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool govulncheck ./...

  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./support-check
        with:
          repository: pawnkit/pawn-actions
          targets: linux-amd64,windows-amd64,darwin-arm64
