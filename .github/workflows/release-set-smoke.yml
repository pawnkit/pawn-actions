name: Release set smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-set-smoke.yml
      - cmd/pawn-release-set/**
      - release-set/**
      - releaseset/**
      - setup/**
      - setup-tool/**
      - build/**
  workflow_dispatch:
    inputs:
      spec-ref:
        description: Exact pawnkit-spec tag or commit
        required: true
        default: v0.1.28
      set-path:
        description: Path below pawnkit-spec
        required: true
        default: release-sets/toolchain-preview-2026-07-25.json
      corpus-ref:
        description: Exact pawn-corpus tag or commit
        required: true
        default: v0.1.11
  workflow_call:
    inputs:
      spec-ref:
        description: Exact pawnkit-spec tag or commit
        required: true
        type: string
      set-path:
        description: Path below pawnkit-spec
        required: true
        type: string
      corpus-ref:
        description: Exact pawn-corpus tag or commit
        required: true
        type: string
permissions:
  contents: read
env:
  SPEC_REF: ${{ inputs.spec-ref || 'v0.1.28' }}
  SET_PATH: ${{ inputs.set-path || 'release-sets/toolchain-preview-2026-07-25.json' }}
  CORPUS_REF: ${{ inputs.corpus-ref || 'v0.1.11' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawnkit-spec
          ref: ${{ env.SPEC_REF }}
          path: .pawnkit/spec
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-actions
          ref: ${{ github.workflow_sha }}
          path: .pawnkit/actions
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .pawnkit/actions/go.mod
          cache-dependency-path: .pawnkit/actions/go.sum
      - uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/${{ env.SET_PATH }}
          verify-remote: 'false'
      - uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/release-sets/dependency-preview-2026-07-25.json
          verify-remote: 'true'

  smoke:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            archive-target: linux_amd64.tar.gz
            pawn-sha256: 466e99ad7e9f743928e5dac2b9c779255b5adbd414cde366ff0e7a6159a63365
            pawnfmt-sha256: a63a13b81508c73062fbb7460e100195a8326084c1bf75594bf2e14029176cbc
            pawnlint-sha256: bc011fea1c27ef0c1f648c8a821c62e99cc8a1f747ff8ff6c1bf074a35b0ea84
            pawnlsp-sha256: 84294736a7f4387cccccb4c894ad9719f9e67ae1e162ca426bddcf655e1b085a
            pawntest-sha256: 75bd68ecb106ded60096e860b636efcfb1750eacb7e3c383eb72d6d44cc93364
          - os: windows-latest
            target: windows-amd64
            archive-target: windows_amd64.zip
            pawn-sha256: 85aedd392ab26e45935dfe962ade5d18573ed8e8b3f81500b540523a651e7907
            pawnfmt-sha256: 0caabe3aac720b145c705d1a7916816a83de6097d436688db080feb1a9ca4168
            pawnlint-sha256: 7b8f17f8519dd2a4338fbc70174c1a376fdf4459d66db7798c773de3ca2d3165
            pawnlsp-sha256: 754c9946a15396b993e72c80e3ff89e523301c6ca3b641dc136eeb46f6fea8d1
            pawntest-sha256: c7a6a727cb9382c5f6668a95c59888411490a1a5abddd298cee7bf33975d6bcd
          - os: macos-latest
            target: darwin-arm64
            archive-target: darwin_arm64.tar.gz
            pawn-sha256: c56d06c3f81eb96f0f389a40c7f2cb7141e7ed69740b97fe71c4de04818a5773
            pawnfmt-sha256: e57408e4075add7e7976167419df7011ebea30ba470a8557e4b0cf73d261ed37
            pawnlint-sha256: dc6cb8d83fc057b279627d064994a1186e66203f98274ebd1c571a16f5371590
            pawnlsp-sha256: e790b7f1b4ae6be0440f03d7cce80d23489b806adc858f42580258d690d6e3be
            pawntest-sha256: e8cc703039722bb56ee60e2e7b5e3633a5eeb706d2a2e9d7187211beaa79edf6
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawnkit-spec
          ref: ${{ env.SPEC_REF }}
          path: .pawnkit/spec
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-actions
          ref: ${{ github.workflow_sha }}
          path: .pawnkit/actions
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-corpus
          ref: ${{ env.CORPUS_REF }}
          path: .pawnkit/corpus
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .pawnkit/actions/go.mod
          cache-dependency-path: .pawnkit/actions/go.sum
      - uses: ./.pawnkit/actions/setup
        with:
          version: 1.3.1
          download-url: https://github.com/pawnkit/pawnkit-cli/releases/download/v1.3.1/pawn-${{ matrix.target }}.tar.gz
          sha256: ${{ matrix.pawn-sha256 }}
      - uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawnfmt
          version: 1.3.6
          download-url: https://github.com/pawnkit/pawnfmt/releases/download/v1.3.6/pawnfmt_1.3.6_${{ matrix.archive-target }}
          sha256: ${{ matrix.pawnfmt-sha256 }}
      - uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawnlint
          version: 1.1.11
          download-url: https://github.com/pawnkit/pawnlint/releases/download/v1.1.11/pawnlint_1.1.11_${{ matrix.archive-target }}
          sha256: ${{ matrix.pawnlint-sha256 }}
      - uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawnlsp
          version: 0.26.11
          download-url: https://github.com/pawnkit/pawnlsp/releases/download/v0.26.11/pawnlsp_0.26.11_${{ matrix.archive-target }}
          sha256: ${{ matrix.pawnlsp-sha256 }}
      - id: pawntest-install
        uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawntest
          version: 1.2.2
          download-url: https://github.com/pawnkit/pawntest/releases/download/v1.2.2/pawntest_1.2.2_${{ matrix.archive-target }}
          sha256: ${{ matrix.pawntest-sha256 }}
      - name: Check installed tools
        shell: bash
        run: |
          pawn --version
          pawnfmt --version
          pawnlint --version
          pawnlsp --version
          pawntest --version
          test -f "${{ steps.pawntest-install.outputs.path }}/include/pawntest.inc"
      - name: Check golden projects
        shell: bash
        run: |
          formatted="$(mktemp -d)"
          for project in minimal-samp-gamemode filterscript-with-includes; do
            path=".pawnkit/corpus/projects/$project"
            pawn doctor --project "$path"
            pawn check --project "$path" --only project,lint
            pawnlint "$path"
            cp -R "$path" "$formatted/$project"
            pawnfmt --write "$formatted/$project"
            pawnfmt --check "$formatted/$project"
          done

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/pawnc-3.10.10-linux/lib
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-actions
          ref: ${{ github.workflow_sha }}
          path: .pawnkit/actions
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-corpus
          ref: ${{ env.CORPUS_REF }}
          path: .pawnkit/corpus
          persist-credentials: false
      - uses: ./.pawnkit/actions/setup
        with:
          version: 1.3.1
          download-url: https://github.com/pawnkit/pawnkit-cli/releases/download/v1.3.1/pawn-linux-amd64.tar.gz
          sha256: 466e99ad7e9f743928e5dac2b9c779255b5adbd414cde366ff0e7a6159a63365
      - name: Install 32-bit compiler runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386
      - name: Install Pawn 3.10.10
        shell: bash
        run: |
          wget -q https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          echo "9bbb1df6e933318fce1fa61951e4196b70613c637a5a1d4c96937e147c18468d  pawnc-3.10.10-linux.tar.gz" | sha256sum -c -
          tar -xzf pawnc-3.10.10-linux.tar.gz
      - uses: ./.pawnkit/actions/build
        with:
          project: .pawnkit/corpus/projects/minimal-samp-gamemode
          compiler: ${{ github.workspace }}/pawnc-3.10.10-linux/bin/pawncc
          artifact: ${{ runner.temp }}/minimal-samp-gamemode.amx
          output: json
          result-file: ${{ runner.temp }}/minimal-samp-gamemode.json
      - uses: ./.pawnkit/actions/build
        with:
          project: .pawnkit/corpus/projects/filterscript-with-includes
          compiler: ${{ github.workspace }}/pawnc-3.10.10-linux/bin/pawncc
          artifact: ${{ runner.temp }}/filterscript-with-includes.amx
          output: json
          result-file: ${{ runner.temp }}/filterscript-with-includes.json
      - name: Check diagnostic contract
        shell: bash
        run: |
          grep -q '"schemaVersion": 2' "${{ runner.temp }}/minimal-samp-gamemode.json"
          grep -q '"schemaVersion": 2' "${{ runner.temp }}/filterscript-with-includes.json"
