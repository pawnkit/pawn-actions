name: Release set smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-set-smoke.yml
      - cmd/pawn-release-set/**
      - release-set/**
      - releaseset/**
      - setup/**
      - setup-tool/**
      - build/**
  workflow_dispatch:
    inputs:
      spec-ref:
        description: Exact pawnkit-spec tag or commit
        required: true
        default: v0.1.99
      set-path:
        description: Path below pawnkit-spec
        required: true
        default: release-sets/toolchain-signed-2026-08-01-14.json
      corpus-ref:
        description: Exact pawn-corpus tag or commit
        required: true
        default: v0.1.20
      verify-remote:
        description: Verify tags, schemas, workflow evidence, and artifacts
        required: false
        default: true
        type: boolean
      verify-attestations:
        description: Verify GitHub artifact attestations
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      spec-ref:
        description: Exact pawnkit-spec tag or commit
        required: true
        type: string
      set-path:
        description: Path below pawnkit-spec
        required: true
        type: string
      corpus-ref:
        description: Exact pawn-corpus tag or commit
        required: true
        type: string
      verify-remote:
        description: Verify tags, schemas, workflow evidence, and artifacts
        required: false
        default: true
        type: boolean
      verify-attestations:
        description: Verify GitHub artifact attestations
        required: false
        default: true
        type: boolean
permissions:
  attestations: read
  contents: read
env:
  SPEC_REF: ${{ inputs.spec-ref || 'v0.1.99' }}
  SET_PATH: ${{ inputs.set-path || 'release-sets/toolchain-signed-2026-08-01-14.json' }}
  CORPUS_REF: ${{ inputs.corpus-ref || 'v0.1.20' }}
  VERIFY_REMOTE: ${{ inputs.verify-remote == false && 'false' || 'true' }}
  VERIFY_ATTESTATIONS: ${{ inputs.verify-attestations == false && 'false' || 'true' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawnkit-spec
          ref: ${{ env.SPEC_REF }}
          path: .pawnkit/spec
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-actions
          ref: ${{ github.workflow_sha }}
          path: .pawnkit/actions
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .pawnkit/actions/go.mod
          cache-dependency-path: .pawnkit/actions/go.sum
      - uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/${{ env.SET_PATH }}
          verify-remote: ${{ env.VERIFY_REMOTE }}
          verify-attestations: ${{ env.VERIFY_ATTESTATIONS }}
      - uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/release-sets/dependency-preview-2026-07-25.json
          verify-remote: 'true'

  smoke:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: windows-latest
            target: windows-amd64
          - os: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawnkit-spec
          ref: ${{ env.SPEC_REF }}
          path: .pawnkit/spec
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-actions
          ref: ${{ github.workflow_sha }}
          path: .pawnkit/actions
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-corpus
          ref: ${{ env.CORPUS_REF }}
          path: .pawnkit/corpus
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .pawnkit/actions/go.mod
          cache-dependency-path: .pawnkit/actions/go.sum
      - id: pawn
        uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/${{ env.SET_PATH }}
          verify-remote: 'false'
          component: pawn
          target: ${{ matrix.target }}
      - uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawn
          version: ${{ steps.pawn.outputs.version }}
          download-url: ${{ steps.pawn.outputs.url }}
          sha256: ${{ steps.pawn.outputs.sha256 }}
      - id: pawnfmt
        uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/${{ env.SET_PATH }}
          verify-remote: 'false'
          component: pawnfmt
          target: ${{ matrix.target }}
      - uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawnfmt
          version: ${{ steps.pawnfmt.outputs.version }}
          download-url: ${{ steps.pawnfmt.outputs.url }}
          sha256: ${{ steps.pawnfmt.outputs.sha256 }}
      - id: pawnlint
        uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/${{ env.SET_PATH }}
          verify-remote: 'false'
          component: pawnlint
          target: ${{ matrix.target }}
      - uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawnlint
          version: ${{ steps.pawnlint.outputs.version }}
          download-url: ${{ steps.pawnlint.outputs.url }}
          sha256: ${{ steps.pawnlint.outputs.sha256 }}
      - id: pawnlsp
        uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/${{ env.SET_PATH }}
          verify-remote: 'false'
          component: pawnlsp
          target: ${{ matrix.target }}
      - uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawnlsp
          version: ${{ steps.pawnlsp.outputs.version }}
          download-url: ${{ steps.pawnlsp.outputs.url }}
          sha256: ${{ steps.pawnlsp.outputs.sha256 }}
      - id: pawntest
        uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/${{ env.SET_PATH }}
          verify-remote: 'false'
          component: pawntest
          target: ${{ matrix.target }}
      - id: pawntest-install
        uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawntest
          version: ${{ steps.pawntest.outputs.version }}
          download-url: ${{ steps.pawntest.outputs.url }}
          sha256: ${{ steps.pawntest.outputs.sha256 }}
      - name: Check installed tools
        shell: bash
        run: |
          pawn --version
          pawnfmt --version
          pawnlint --version
          pawnlsp --version
          pawntest --version
          pawn toolchain --release-set ".pawnkit/spec/${SET_PATH}"
          test -f "${{ steps.pawntest-install.outputs.path }}/include/pawntest.inc"
      - name: Check project health
        shell: bash
        run: |
          for project in minimal-gamemode minimal-samp-gamemode filterscript-with-includes; do
            pawn doctor --project ".pawnkit/corpus/projects/$project"
          done
      - name: Check formatting
        shell: bash
        run: |
          for project in minimal-gamemode minimal-samp-gamemode filterscript-with-includes; do
            pawn fmt --project ".pawnkit/corpus/projects/$project" --check
          done
      - name: Check lint
        shell: bash
        run: |
          for project in minimal-gamemode minimal-samp-gamemode filterscript-with-includes; do
            pawn lint --project ".pawnkit/corpus/projects/$project"
          done
      - name: Check formatter writes
        shell: bash
        run: |
          formatted="$PWD/.pawnkit/formatted"
          mkdir -p "$formatted"
          for project in minimal-gamemode minimal-samp-gamemode filterscript-with-includes; do
            path=".pawnkit/corpus/projects/$project"
            cp -R "$path" "$formatted/$project"
            pawn fmt --project "$formatted/$project"
            pawn fmt --project "$formatted/$project" --check
          done

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/pawnc-3.10.10-linux/lib
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawnkit-spec
          ref: ${{ env.SPEC_REF }}
          path: .pawnkit/spec
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-actions
          ref: ${{ github.workflow_sha }}
          path: .pawnkit/actions
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pawnkit/pawn-corpus
          ref: ${{ env.CORPUS_REF }}
          path: .pawnkit/corpus
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .pawnkit/actions/go.mod
          cache-dependency-path: .pawnkit/actions/go.sum
      - id: pawn
        uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/${{ env.SET_PATH }}
          verify-remote: 'false'
          component: pawn
          target: linux-amd64
      - uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawn
          version: ${{ steps.pawn.outputs.version }}
          download-url: ${{ steps.pawn.outputs.url }}
          sha256: ${{ steps.pawn.outputs.sha256 }}
      - id: pawntest
        uses: ./.pawnkit/actions/release-set
        with:
          release-set: .pawnkit/spec/${{ env.SET_PATH }}
          verify-remote: 'false'
          component: pawntest
          target: linux-amd64
      - uses: ./.pawnkit/actions/setup-tool
        with:
          binary: pawntest
          version: ${{ steps.pawntest.outputs.version }}
          download-url: ${{ steps.pawntest.outputs.url }}
          sha256: ${{ steps.pawntest.outputs.sha256 }}
      - name: Install 32-bit runtime libraries
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libatomic1:i386
      - name: Install Pawn 3.10.10
        shell: bash
        run: |
          wget -q https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          echo "9bbb1df6e933318fce1fa61951e4196b70613c637a5a1d4c96937e147c18468d  pawnc-3.10.10-linux.tar.gz" | sha256sum -c -
          tar -xzf pawnc-3.10.10-linux.tar.gz
          echo "${{ github.workspace }}/pawnc-3.10.10-linux/bin" >> "$GITHUB_PATH"
      - name: Build run backend fixture
        shell: bash
        working-directory: .pawnkit/actions
        run: go build -o "${{ runner.temp }}/pawn-run-fixture" ./tests/backendfixture
      - uses: ./.pawnkit/actions/build
        with:
          project: .pawnkit/corpus/projects/minimal-gamemode
          compiler: ${{ github.workspace }}/pawnc-3.10.10-linux/bin/pawncc
          artifact: ${{ runner.temp }}/minimal-gamemode.amx
          output: json
          result-file: ${{ runner.temp }}/minimal-gamemode.json
      - uses: ./.pawnkit/actions/build
        with:
          project: .pawnkit/corpus/projects/minimal-samp-gamemode
          compiler: ${{ github.workspace }}/pawnc-3.10.10-linux/bin/pawncc
          artifact: ${{ runner.temp }}/minimal-samp-gamemode.amx
          output: json
          result-file: ${{ runner.temp }}/minimal-samp-gamemode.json
      - uses: ./.pawnkit/actions/build
        with:
          project: .pawnkit/corpus/projects/filterscript-with-includes
          compiler: ${{ github.workspace }}/pawnc-3.10.10-linux/bin/pawncc
          artifact: ${{ runner.temp }}/filterscript-with-includes.amx
          output: json
          result-file: ${{ runner.temp }}/filterscript-with-includes.json
      - name: Check, test, and run golden projects
        shell: bash
        run: |
          for project in minimal-samp-gamemode filterscript-with-includes; do
            path=".pawnkit/corpus/projects/$project"
            artifact="${{ runner.temp }}/$project.amx"
            pawn doctor --project "$path"
            pawn test --project "$path"
            pawn run \
              --project "$path" \
              --backend "${{ runner.temp }}/pawn-run-fixture" \
              --artifact "$artifact"
          done
      - name: Start native open.mp runtime
        shell: bash
        run: |
          runtime_help="$(pawn runtime install --help 2>&1 || true)"
          if ! grep -q 'Usage of runtime install' <<< "$runtime_help"; then
            echo "Selected pawn release does not support native runtimes; skipping."
            exit 0
          fi

          runtime_output="$(pawn runtime install 2>&1)" || {
            runtime_output="${runtime_output//$'\n'/ }"
            echo "::error title=Native runtime install::${runtime_output//'%'/'%25'}"
            exit 1
          }
          echo "$runtime_output"
          timeout -s INT -k 2s 6s \
            pawn run --project .pawnkit/corpus/projects/minimal-gamemode \
            > "${{ runner.temp }}/native-run.log" 2>&1 || true
          cat "${{ runner.temp }}/native-run.log"
          {
            echo '### Native open.mp smoke'
            echo '```text'
            cat "${{ runner.temp }}/native-run.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q 'minimal-gamemode loaded' "${{ runner.temp }}/native-run.log"; then
            native_output="$(tr '\n' ' ' < "${{ runner.temp }}/native-run.log")"
            echo "::error title=Native runtime start::${native_output//'%'/'%25'}"
            exit 1
          fi
      - name: Check diagnostic contract
        shell: bash
        run: |
          grep -q '"schemaVersion": 2' "${{ runner.temp }}/minimal-gamemode.json"
          grep -q '"schemaVersion": 2' "${{ runner.temp }}/minimal-samp-gamemode.json"
          grep -q '"schemaVersion": 2' "${{ runner.temp }}/filterscript-with-includes.json"
